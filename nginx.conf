# ============================================================
# 校内BBS Nginx 反向代理配置示例
# 适用系统：Ubuntu / CentOS
# 配置文件路径：/etc/nginx/conf.d/bbs.conf
# ============================================================

upstream bbs_backend {
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name bbs.yourschool.edu.cn;   # 替换为实际域名或服务器IP

    # 字符集
    charset utf-8;

    # 访问日志
    access_log /var/log/nginx/bbs_access.log;
    error_log /var/log/nginx/bbs_error.log;

    # 客户端请求体大小限制（上传文件）
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # ==================== 上传目录映射 ====================
    location /upload/ {
        alias /opt/bbs/upload/;          # 上传文件存储路径
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== 静态资源 ====================
    location /static/ {
        alias /opt/bbs/static/;          # 也可打包在 JAR 内，此处为外置静态资源
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== 反向代理到 Spring Boot ====================
    location / {
        proxy_pass http://bbs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ==================== 健康检查 ====================
    location /health {
        access_log off;
        return 200 "OK";
    }
}