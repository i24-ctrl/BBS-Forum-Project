<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('需求详情')}"></head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="bbs-main">
<div class="bbs-container-narrow">
    <!-- 需求详情 -->
    <div class="bbs-card">
        <div class="bbs-card-body">
            <div id="loadingArea" class="text-center py-4 text-muted">加载中...</div>
            <div id="detailArea" style="display:none;">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h4 id="demandTitle" class="fw-bold"></h4>
                    <span class="bbs-score-text fs-5"><i class="bi bi-coin"></i> <span id="demandScore"></span> 积分</span>
                </div>
                <div class="mb-3">
                    <span class="text-muted small">👤 <span id="demandAuthor"></span></span>
                    <span class="mx-2">|</span>
                    <span class="badge" id="demandStatusBadge"></span>
                    <span class="mx-2">|</span>
                    <span class="text-muted small">🕐 <span id="demandTime"></span></span>
                    <span id="resolverInfo" class="text-muted small" style="display:none;">
                        <span class="mx-1">|</span> ✅ 解决者：<span id="resolverName"></span>
                    </span>
                </div>
                <hr>
                <div id="demandContent" class="bbs-rich-content"></div>

                <!-- 发布者操作按钮 -->
                <div class="mt-3" id="ownerActions" style="display:none;">
                    <button class="btn btn-danger btn-sm" id="closeBtn" onclick="closeDemand()">关闭需求（退回积分）</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 回复列表 -->
    <div class="bbs-card">
        <div class="bbs-card-body">
            <h5 class="bbs-section-title"><i class="bi bi-chat-dots me-1"></i>回复</h5>
            <div id="replyList"></div>
        </div>
    </div>

    <!-- 回复表单 -->
    <div class="bbs-card bbs-reply-form-sticky">
        <div class="bbs-card-body p-3">
            <div id="replyFormArea">
                <form id="replyForm">
                    <div class="input-group">
                        <textarea class="form-control" id="replyContent" rows="2"
                                  placeholder="写下你的解决方案..." required></textarea>
                        <button class="btn btn-bbs-primary" type="submit" id="replySubmitBtn">提交回复</button>
                    </div>
                </form>
            </div>
            <div id="loginHint" style="display:none;" class="text-center py-2">
                <a href="/login" class="btn btn-primary btn-sm">登录后回复</a>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<script src="/static/js/common.js"></script>
<script>
    const token = localStorage.getItem('token');
    const urlParams = new URLSearchParams(window.location.search);
    const demandId = urlParams.get('id');
    let currentDemand = null;
    let currentUserId = null;

    if (!demandId) {
        document.getElementById('loadingArea').innerHTML = '<div class="text-muted py-5">无效的链接</div>';
    }

    function apiGet(url) {
        const headers = {};
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { headers }).then(res => res.json());
    }

    function apiPost(url, data) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { method: 'POST', headers, body: JSON.stringify(data) })
            .then(res => {
                if (res.status === 401) { showToast('请先登录', 'error'); throw new Error('unauthorized'); }
                return res.json();
            });
    }

    function apiPut(url) {
        const headers = {};
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { method: 'PUT', headers })
            .then(res => {
                if (res.status === 401) { showToast('请先登录', 'error'); throw new Error('unauthorized'); }
                return res.json();
            });
    }

    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
        const html = '<div class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
            '<div class="d-flex"><div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = container.lastElementChild;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 解析 token 获取 userId（简单解析 JWT payload）
    function parseUserId() {
        if (!token) return null;
        try {
            const parts = token.split('.');
            if (parts.length !== 3) return null;
            const payload = JSON.parse(atob(parts[1]));
            return payload.userId || null;
        } catch (e) {
            return null;
        }
    }

    currentUserId = parseUserId();

    // 登录状态
    if (token) {
        document.getElementById('replyFormArea').style.display = 'block';
        document.getElementById('loginHint').style.display = 'none';
    } else {
        document.getElementById('replyFormArea').style.display = 'none';
        document.getElementById('loginHint').style.display = 'block';
    }

    function loadDetail() {
        apiGet('/api/v1/demands/' + demandId).then(result => {
            if (result.code !== 200) {
                document.getElementById('loadingArea').innerHTML = '<div class="text-muted py-5">' + (result.msg || '加载失败') + '</div>';
                return;
            }
            currentDemand = result.data;
            renderDetail(currentDemand);
            renderReplies(currentDemand.replies || [], currentDemand.adoptReplyId);
        });
    }

    function renderDetail(d) {
        document.getElementById('loadingArea').style.display = 'none';
        document.getElementById('detailArea').style.display = 'block';
        document.getElementById('demandTitle').textContent = d.title;
        document.getElementById('demandScore').textContent = d.score;
        document.getElementById('demandAuthor').textContent = d.authorName || '匿名';
        document.getElementById('demandContent').innerHTML = d.content || '';
        document.getElementById('demandTime').textContent = d.createTime || '';

        const badge = document.getElementById('demandStatusBadge');
        badge.textContent = d.statusStr || '';
        badge.className = 'badge status-badge-' + (d.status || 0);

        if (d.resolverName) {
            document.getElementById('resolverInfo').style.display = 'inline';
            document.getElementById('resolverName').textContent = d.resolverName;
        }

        // 发布者操作按钮
        if (currentUserId && d.userId === currentUserId && d.status === 0) {
            document.getElementById('ownerActions').style.display = 'block';
        }

        // 更新可采纳状态
        window._demandStatus = d.status;
        window._demandUserId = d.userId;
        window._adoptReplyId = d.adoptReplyId;
    }

    function renderReplies(replies, adoptReplyId) {
        const container = document.getElementById('replyList');
        if (!replies || replies.length === 0) {
            container.innerHTML = '<p class="text-muted text-center py-3">暂无回复</p>';
            return;
        }

        let html = '';
        replies.forEach(r => {
            const isAdopted = adoptReplyId && r.id === adoptReplyId;
            html += '<div class="reply-item' + (isAdopted ? ' reply-adopted' : '') + '">';
            html += '<div class="d-flex justify-content-between align-items-start">';
            html += '<div class="flex-grow-1">';
            html += '<strong class="small">' + escapeHtml(r.authorName || '匿名') + '</strong>';
            if (isAdopted) html += ' <span class="badge bg-success">✅ 已采纳</span>';
            html += '<div class="small mt-1">' + escapeHtml(r.content || '') + '</div>';
            html += '<small class="text-muted">' + (r.createTime || '') + '</small>';
            html += '</div>';
            // 采纳按钮（仅发布者可见，且需求进行中、回复未被采纳）
            if (currentUserId && window._demandUserId === currentUserId
                && window._demandStatus === 0 && !isAdopted
                && r.userId !== currentUserId) {
                html += '<button class="btn btn-success btn-sm ms-2" onclick="adoptReply(' + r.id + ')">采纳</button>';
            }
            html += '</div></div>';
        });
        container.innerHTML = html;
    }

    function adoptReply(replyId) {
        if (!confirm('确认采纳该回复？悬赏积分将发放给回复者，此操作不可撤回。')) return;
        apiPut('/api/v1/demands/' + demandId + '/adopt/' + replyId).then(result => {
            if (result.code === 200) {
                showToast(result.msg, 'success');
                loadDetail();
            } else {
                showToast(result.msg, 'error');
            }
        }).catch(() => {});
    }

    function closeDemand() {
        if (!confirm('确认关闭该需求？冻结积分将退回您的账户。')) return;
        apiPut('/api/v1/demands/' + demandId + '/close').then(result => {
            if (result.code === 200) {
                showToast(result.msg, 'success');
                loadDetail();
            } else {
                showToast(result.msg, 'error');
            }
        }).catch(() => {});
    }

    // 提交回复
    document.getElementById('replyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!token) { showToast('请先登录', 'error'); return; }
        const content = document.getElementById('replyContent').value.trim();
        if (!content) return;

        const submitBtn = document.getElementById('replySubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';

        apiPost('/api/v1/demands/' + demandId + '/reply', { content: content })
            .then(result => {
                if (result.code === 200) {
                    showToast('回复成功', 'success');
                    document.getElementById('replyContent').value = '';
                    loadDetail();
                } else {
                    showToast(result.msg, 'error');
                }
            })
            .catch(() => {})
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = '提交回复';
            });
    });

    if (demandId) loadDetail();
</script>

</body>
</html>
