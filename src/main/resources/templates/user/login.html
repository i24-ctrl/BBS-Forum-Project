<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('登录')}"></head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="bbs-main">
<div class="bbs-container-auth">
    <div class="bbs-auth-card">
        <div class="card-body">
            <h3 class="bbs-auth-title"><i class="bi bi-shield-lock me-1"></i>登录</h3>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="请输入用户名" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="请输入密码" required>
                        </div>

                        <button type="submit" class="btn btn-bbs-primary w-100" id="submitBtn">登录</button>
                    </form>

                    <div class="text-center mt-3">
                        还没有账号？<a href="/register">立即注册</a>
                    </div>

                    <hr>
                    <div class="text-muted small">
                        <p class="mb-1">🧪 测试账号：</p>
                        <p class="mb-0">管理员：admin / 123456</p>
                        <p class="mb-0">普通用户：testuser / 123456</p>
                        <p class="mb-0">待审核：newuser / 123456</p>
                    </div>
                </div>
            </div>
</div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
<script src="/static/js/common.js"></script>
<script>
            function showToast(message, type) {
            const container = document.getElementById('toastContainer');
            const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
            const html = '<div class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
            '<div class="d-flex"><div class="toast-body">' + message + '</div>' +
                '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
            container.insertAdjacentHTML('beforeend', html);
            const toastEl = container.lastElementChild;
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
            }

            document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';

            const data = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
            };

            fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
            if (result.code === 200) {
            // 保存 token 到 localStorage
            localStorage.setItem('token', result.data.token);
            localStorage.setItem('expiresIn', result.data.expiresIn);
            showToast('登录成功，正在跳转...', 'success');
            setTimeout(function() { window.location.href = '/'; }, 800);
            } else {
            showToast(result.msg, 'error');
            }
            })
            .catch(err => {
            showToast('网络异常，请稍后重试', 'error');
            })
            .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = '登录';
            });
            });
        </script>

    </body>
</html>
