<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('个人中心')}"></head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="bbs-main">
<div class="bbs-container-narrow profile-container">
    <!-- 用户信息卡片 -->
    <div class="bbs-card" id="profileCard">
        <div class="bbs-card-body">
            <h4 class="bbs-page-title mb-3"><i class="bi bi-person me-1"></i>个人资料</h4>
            <div id="profileView">
                <table class="table table-borderless">
                    <tr><td class="text-muted" style="width:100px;">用户名</td><td id="viewUsername">-</td></tr>
                    <tr><td class="text-muted">真实姓名</td><td id="viewRealName">-</td></tr>
                    <tr><td class="text-muted">手机号</td><td id="viewPhone">-</td></tr>
                    <tr><td class="text-muted">邮箱</td><td id="viewEmail">-</td></tr>
                    <tr><td class="text-muted">工作地点</td><td id="viewWorkPlace">-</td></tr>
                    <tr><td class="text-muted">工作性质</td><td id="viewJobNature">-</td></tr>
                    <tr>
                        <td class="text-muted">积分</td>
                        <td>
                            <span class="score-badge text-warning" id="viewScore">0</span> 可用
                            &nbsp;|&nbsp;
                            <span class="text-muted">冻结：</span><span id="viewFrozenScore">0</span>
                        </td>
                    </tr>
                    <tr><td class="text-muted">登录次数</td><td id="viewLoginCount">-</td></tr>
                    <tr><td class="text-muted">注册时间</td><td id="viewCreateTime">-</td></tr>
                </table>
                <button class="btn btn-bbs-primary" onclick="toggleEdit(true)">编辑资料</button>
            </div>

            <!-- 编辑表单（默认隐藏） -->
            <div id="profileEdit" style="display:none;">
                <form id="editForm">
                    <div class="mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="editRealName" maxlength="50">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="editPhone" maxlength="20">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="editEmail" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">工作地点</label>
                        <input type="text" class="form-control" id="editWorkPlace" maxlength="100">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">工作性质</label>
                        <select class="form-select" id="editJobNature">
                            <option value="">请选择</option>
                            <option value="学生">学生</option>
                            <option value="前端开发">前端开发</option>
                            <option value="后端开发">后端开发</option>
                            <option value="全栈开发">全栈开发</option>
                            <option value="测试">测试</option>
                            <option value="运维">运维</option>
                            <option value="产品经理">产品经理</option>
                            <option value="UI设计">UI设计</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">保存</button>
                    <button type="button" class="btn btn-secondary" onclick="toggleEdit(false)">取消</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 积分流水卡片 -->
    <div class="bbs-card">
        <div class="bbs-card-body">
            <h4 class="bbs-page-title mb-3"><i class="bi bi-bar-chart me-1"></i>积分流水</h4>
            <div id="scoreRecordList">
                <p class="text-muted text-center">加载中...</p>
            </div>
            <nav id="scorePagination" class="d-flex justify-content-center mt-3"></nav>
        </div>
    </div>
</div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<script src="/static/js/common.js"></script>
<script>
    const token = localStorage.getItem('token');

    // 如果未登录，跳转登录页
    if (!token) {
        window.location.href = '/login';
    }

    // ==================== API 封装 ====================
    function apiGet(url) {
        return fetch(url, {
            headers: { 'Authorization': 'Bearer ' + token }
        }).then(res => {
            if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
            return res.json();
        });
    }

    function apiPut(url, data) {
        return fetch(url, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify(data)
        }).then(res => {
            if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
            return res.json();
        });
    }

    // ==================== Toast ====================
    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
        const html = '<div class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
            '<div class="d-flex"><div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = container.lastElementChild;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
    }

    // ==================== 加载个人资料 ====================
    let currentProfile = null;

    function loadProfile() {
        apiGet('/api/v1/user/profile').then(result => {
            if (result.code === 200) {
                currentProfile = result.data;
                renderProfile(currentProfile);
            }
        });
    }

    function renderProfile(profile) {
        document.getElementById('viewUsername').textContent = profile.username;
        document.getElementById('viewRealName').textContent = profile.realName || '-';
        document.getElementById('viewPhone').textContent = profile.phone || '-';
        document.getElementById('viewEmail').textContent = profile.email || '-';
        document.getElementById('viewWorkPlace').textContent = profile.workPlace || '-';
        document.getElementById('viewJobNature').textContent = profile.jobNature || '-';
        document.getElementById('viewScore').textContent = profile.score;
        document.getElementById('viewFrozenScore').textContent = profile.frozenScore;
        document.getElementById('viewLoginCount').textContent = profile.loginCount;
        document.getElementById('viewCreateTime').textContent = profile.createTime || '-';
    }

    // ==================== 编辑模式切换 ====================
    function toggleEdit(show) {
        if (show) {
            document.getElementById('editRealName').value = currentProfile.realName || '';
            document.getElementById('editPhone').value = currentProfile.phone || '';
            document.getElementById('editEmail').value = currentProfile.email || '';
            document.getElementById('editWorkPlace').value = currentProfile.workPlace || '';
            document.getElementById('editJobNature').value = currentProfile.jobNature || '';
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('profileEdit').style.display = 'block';
        } else {
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileEdit').style.display = 'none';
        }
    }

    document.getElementById('editForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            realName: document.getElementById('editRealName').value.trim() || null,
            phone: document.getElementById('editPhone').value.trim() || null,
            email: document.getElementById('editEmail').value.trim() || null,
            workPlace: document.getElementById('editWorkPlace').value.trim() || null,
            jobNature: document.getElementById('editJobNature').value || null
        };

        apiPut('/api/v1/user/profile', data).then(result => {
            if (result.code === 200) {
                showToast('保存成功', 'success');
                toggleEdit(false);
                loadProfile();
            } else {
                showToast(result.msg, 'error');
            }
        });
    });

    // ==================== 积分流水 ====================
    function loadScoreRecords(page) {
        page = page || 1;
        apiGet('/api/v1/user/score?page=' + page + '&size=5').then(result => {
            if (result.code === 200) {
                renderScoreRecords(result.data);
            }
        });
    }

    function renderScoreRecords(data) {
        const list = document.getElementById('scoreRecordList');
        const typeMap = { 1: '获得', 2: '支出', 3: '冻结', 4: '解冻' };
        const colorMap = { 1: 'text-success', 2: 'text-danger', 3: 'text-warning', 4: 'text-info' };

        if (!data.records || data.records.length === 0) {
            list.innerHTML = '<p class="text-muted text-center">暂无积分记录</p>';
            document.getElementById('scorePagination').innerHTML = '';
            return;
        }

        let html = '<div class="list-group list-group-flush">';
        data.records.forEach(r => {
            const sign = r.type === 1 || r.type === 4 ? '+' : '-';
            html += '<div class="list-group-item d-flex justify-content-between align-items-center">';
            html += '<div><span class="' + (colorMap[r.type] || '') + ' fw-bold">' + sign + r.amount + '</span> ';
            html += '<small class="text-muted">[' + (typeMap[r.type] || '未知') + ']</small> ';
            html += '<small>' + (r.remark || '') + '</small></div>';
            html += '<div><small class="text-muted">余额：' + r.balance + '</small> ';
            html += '<small class="text-muted">' + (r.createTime || '') + '</small></div>';
            html += '</div>';
        });
        html += '</div>';
        list.innerHTML = html;

        // 分页
        const pag = document.getElementById('scorePagination');
        let pagHtml = '';
        pagHtml += '<ul class="pagination pagination-sm">';
        pagHtml += '<li class="page-item' + (data.current <= 1 ? ' disabled' : '') + '">';
        pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadScoreRecords(' + (data.current - 1) + ')">上一页</a></li>';
        for (let i = 1; i <= data.pages; i++) {
            pagHtml += '<li class="page-item' + (i === data.current ? ' active' : '') + '">';
            pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadScoreRecords(' + i + ')">' + i + '</a></li>';
        }
        pagHtml += '<li class="page-item' + (data.current >= data.pages ? ' disabled' : '') + '">';
        pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadScoreRecords(' + (data.current + 1) + ')">下一页</a></li>';
        pagHtml += '</ul>';
        pag.innerHTML = pagHtml;
    }

    // ==================== 初始化 ====================
    loadProfile();
    loadScoreRecords(1);
</script>

</body>
</html>
