<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '校内BBS论坛'">校内BBS论坛</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 页面自定义样式 -->
    <th:block th:replace="${pageStyles} ?: ~{}" />

    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<div th:replace="~{common/header :: header}"></div>

<!-- 主体内容 -->
<main class="main-content">
    <th:block th:replace="${pageContent} ?: ~{}" />
</main>

<!-- 页脚 -->
<div th:replace="~{common/footer :: footer}"></div>

<!-- 公共 JS -->
<script src="/static/js/common.js"></script>

<!-- Toast 容器 -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="globalToastContainer"></div>

<!-- 页面自定义脚本 -->
<th:block th:replace="${pageScripts} ?: ~{}" />

</body>
</html>
