<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('帖子详情')}"></head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="bbs-main">
<div class="bbs-container-narrow" id="app">
    <div class="bbs-card mb-4" id="postContentCard">
        <div class="bbs-card-body">
            <div id="postLoading" class="text-center py-4 text-muted">加载中...</div>
            <div id="postDetail" style="display:none;">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h4 id="postTitle" class="mb-0"></h4>
                    <a id="editPostBtn" class="btn btn-outline-primary btn-sm" style="display:none;">✏️ 编辑</a>
                </div>
                <div class="mb-3">
                    <span class="text-muted small" id="postMeta"></span>
                </div>
                <hr>
                <div class="bbs-rich-content" id="postContent"></div>
            </div>
        </div>
    </div>

    <div class="bbs-card mb-4">
        <div class="bbs-card-body">
            <h5 class="bbs-section-title mb-3"><i class="bi bi-chat-dots me-1"></i>回复 <small class="text-muted" id="replyCount"></small></h5>
            <div id="replyList"></div>
        </div>
    </div>

    <div class="bbs-card bbs-reply-form-sticky">
        <div class="bbs-card-body p-3">
            <div id="replyFormArea">
                <form id="replyForm">
                    <input type="hidden" id="replyParentId" value="">
                    <div class="mb-2">
                        <small class="text-muted" id="replyToHint"></small>
                    </div>
                    <div class="input-group">
                        <textarea class="form-control" id="replyContent" rows="2"
                                  placeholder="写下你的回复..." required></textarea>
                        <button class="btn btn-bbs-primary" type="submit" id="replySubmitBtn">回复</button>
                    </div>
                </form>
            </div>
            <div id="loginHint" style="display:none;" class="text-center py-3">
                <p class="text-muted mb-2">请先登录后再回复</p>
                <a href="/login" class="btn btn-bbs-outline btn-sm">去登录</a>
            </div>
        </div>
    </div>
</div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="globalToastContainer"></div>

<script src="/static/js/common.js"></script>
<script>
    var token = localStorage.getItem('token');
    var urlParams = new URLSearchParams(window.location.search);
    var postId = urlParams.get('id');

    if (!postId) {
        document.getElementById('postContentCard').innerHTML =
            '<div class="card-body text-center text-muted py-5">无效的帖子链接</div>';
    }

    function apiGet(url) {
        var headers = {};
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { headers: headers }).then(function(res) { return res.json(); });
    }

    function apiPost(url, data) {
        var headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(data) })
            .then(function(res) {
                if (res.status === 401) { BbsToast.error('请先登录'); document.getElementById('loginHint').style.display = 'block'; document.getElementById('replyFormArea').style.display = 'none'; throw new Error('unauthorized'); }
                return res.json();
            });
    }

    // 登录状态
    if (token) {
        document.getElementById('replyFormArea').style.display = 'block';
        document.getElementById('loginHint').style.display = 'none';
    } else {
        document.getElementById('replyFormArea').style.display = 'none';
        document.getElementById('loginHint').style.display = 'block';
    }

    // 加载帖子详情
    function loadPostDetail() {
        apiGet('/api/v1/posts/' + postId).then(function(result) {
            if (result.code !== 200) {
                document.getElementById('postLoading').textContent = result.msg || '帖子加载失败';
                return;
            }
            var p = result.data;
            document.getElementById('postLoading').style.display = 'none';
            document.getElementById('postDetail').style.display = 'block';
            document.getElementById('postTitle').textContent = p.title;
            document.getElementById('postMeta').innerHTML =
                '👤 ' + BbsUtil.escapeHtml(p.authorName || '匿名') +
                ' &nbsp;|&nbsp; 📋 ' + BbsUtil.escapeHtml(p.boardName || '') +
                ' &nbsp;|&nbsp; 👁 ' + (p.viewCount || 0) +
                ' &nbsp;|&nbsp; 🕐 ' + (p.createTime || '');
            document.getElementById('postContent').innerHTML = p.content || '';
            document.getElementById('replyCount').textContent = '(' + (p.replyCount || 0) + '条)';

            // 编辑按钮：作者或管理员可见
            var currentUserId = BbsAuth.getUserId();
            var currentRole = BbsAuth.getRole();
            if (currentUserId && (currentUserId == p.userId || currentRole === 1)) {
                var editBtn = document.getElementById('editPostBtn');
                editBtn.style.display = '';
                editBtn.href = '/post-form?id=' + p.id;
            }

            renderReplies(p.replies || []);
        });
    }

    function renderReplies(replies) {
        var container = document.getElementById('replyList');
        if (!replies || replies.length === 0) {
            container.innerHTML = '<p class="text-muted text-center py-3">暂无回复，快来抢沙发吧~</p>';
            return;
        }

        var html = '';
        replies.forEach(function(r) {
            html += '<div class="bbs-reply-item">';
            html += '<div class="d-flex">';
            html += '<div class="me-2 text-center" style="min-width:40px;">';
            html += '<div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width:32px;height:32px;font-size:0.75rem;">';
            html += (r.authorName || '?').charAt(0).toUpperCase();
            html += '</div></div>';
            html += '<div class="flex-grow-1">';
            html += '<div class="d-flex justify-content-between align-items-center mb-1">';
            html += '<strong class="small">' + BbsUtil.escapeHtml(r.authorName || '匿名') + '</strong>';
            html += '<span class="floor-badge">#' + r.floor + '楼</span>';
            html += '</div>';
            html += '<div class="small mb-1">' + BbsUtil.escapeHtml(r.content || '') + '</div>';
            html += '<div class="d-flex justify-content-between align-items-center">';
            html += '<small class="text-muted">' + (r.createTime || '') + '</small>';
            html += '<button class="btn btn-sm btn-outline-secondary" onclick="replyTo(' + r.id + ',' + r.floor + ',\'' + BbsUtil.escapeHtml(r.authorName || '') + '\')">💬 回复</button>';
            html += '</div>';

            if (r.children && r.children.length > 0) {
                r.children.forEach(function(child) {
                    html += '<div class="bbs-reply-child">';
                    html += '<strong class="small">' + BbsUtil.escapeHtml(child.authorName || '匿名') + '</strong>';
                    html += '<span class="floor-badge ms-1">#' + child.floor + '楼</span>';
                    html += '<div class="small mt-1">' + BbsUtil.escapeHtml(child.content || '') + '</div>';
                    html += '<small class="text-muted">' + (child.createTime || '') + '</small>';
                    html += '</div>';
                });
            }

            html += '</div></div></div>';
        });
        container.innerHTML = html;
    }

    window.replyTo = function(parentId, floor, authorName) {
        document.getElementById('replyParentId').value = parentId;
        document.getElementById('replyToHint').textContent = '回复 #' + floor + '楼 @' + authorName + '：';
        document.getElementById('replyContent').focus();
    };

    document.getElementById('replyForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (!token) { BbsToast.error('请先登录'); return; }

        var content = document.getElementById('replyContent').value.trim();
        if (!content) return;

        var parentId = document.getElementById('replyParentId').value || null;
        var submitBtn = document.getElementById('replySubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';

        apiPost('/api/v1/posts/' + postId + '/reply', {
            content: content,
            parentId: parentId ? parseInt(parentId) : null
        }).then(function(result) {
            if (result.code === 200) {
                BbsToast.success('回复成功');
                document.getElementById('replyContent').value = '';
                document.getElementById('replyParentId').value = '';
                document.getElementById('replyToHint').textContent = '';
                loadPostDetail();
            } else {
                BbsToast.error(result.msg);
            }
        }).catch(function() {}).finally(function() {
            submitBtn.disabled = false;
            submitBtn.textContent = '回复';
        });
    });

    if (postId) loadPostDetail();
</script>

</body>
</html>
