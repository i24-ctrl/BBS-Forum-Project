<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 校内BBS 后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f5f5; }
        .admin-container { max-width: 1100px; margin: 30px auto; }
        .card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .status-badge-0 { background-color: #ffc107; color: #333; }
        .status-badge-1 { background-color: #28a745; color: #fff; }
        .status-badge-2 { background-color: #dc3545; color: #fff; }
    </style>
</head>
<body>

<div class="container admin-container">
    <div class="card">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-0">👥 用户管理</h4>
                <div>
                    <select class="form-select form-select-sm d-inline-block w-auto" id="statusFilter" onchange="loadUsers(1)">
                        <option value="">全部状态</option>
                        <option value="0" selected>待审核</option>
                        <option value="1">正常</option>
                        <option value="2">已禁用</option>
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>真实姓名</th>
                        <th>邮箱</th>
                        <th>积分</th>
                        <th>状态</th>
                        <th>注册时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <nav id="userPagination" class="d-flex justify-content-center"></nav>
        </div>
    </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    function apiGet(url) {
        return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
                if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
                if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
                return res.json();
            });
    }

    function apiPut(url) {
        return fetch(url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
                if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
                if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
                return res.json();
            });
    }

    function apiDel(url) {
        return fetch(url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
                if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
                if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
                return res.json();
            });
    }

    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
        const html = '<div class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
            '<div class="d-flex"><div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
        container.insertAdjacentHTML('beforeend', html);
        const toastEl = container.lastElementChild;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
    }

    const statusMap = { 0: '待审核', 1: '正常', 2: '已禁用' };

    function loadUsers(page) {
        page = page || 1;
        const status = document.getElementById('statusFilter').value;
        let url = '/api/v1/admin/users?page=' + page + '&size=10';
        if (status !== '') url += '&status=' + status;

        apiGet(url).then(result => {
            if (result.code === 200) {
                renderUsers(result.data);
            } else {
                showToast(result.msg, 'error');
            }
        });
    }

    function renderUsers(data) {
        const tbody = document.getElementById('userTableBody');
        if (!data.records || data.records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无数据</td></tr>';
            document.getElementById('userPagination').innerHTML = '';
            return;
        }

        let html = '';
        data.records.forEach(u => {
            html += '<tr>';
            html += '<td>' + u.id + '</td>';
            html += '<td><strong>' + escapeHtml(u.username) + '</strong></td>';
            html += '<td>' + (u.realName || '-') + '</td>';
            html += '<td>' + (u.email || '-') + '</td>';
            html += '<td>' + u.score + '</td>';
            html += '<td><span class="badge status-badge-' + u.status + '">' + (statusMap[u.status] || '未知') + '</span></td>';
            html += '<td><small>' + (u.createTime || '') + '</small></td>';
            html += '<td>';
            if (u.status === 0) {
                html += '<button class="btn btn-success btn-sm me-1" onclick="approveUser(' + u.id + ')">通过</button>';
                html += '<button class="btn btn-danger btn-sm" onclick="deleteUser(' + u.id + ')">拒绝</button>';
            } else if (u.status === 1) {
                html += '<button class="btn btn-warning btn-sm" onclick="disableUser(' + u.id + ')">禁用</button>';
            } else if (u.status === 2) {
                html += '<button class="btn btn-info btn-sm" onclick="enableUser(' + u.id + ')">恢复</button>';
            }
            html += '</td>';
            html += '</tr>';
        });
        tbody.innerHTML = html;

        // 分页
        const pag = document.getElementById('userPagination');
        let pagHtml = '<ul class="pagination pagination-sm">';
        pagHtml += '<li class="page-item' + (data.current <= 1 ? ' disabled' : '') + '">';
        pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadUsers(' + (data.current - 1) + ')">上一页</a></li>';
        for (let i = 1; i <= data.pages; i++) {
            pagHtml += '<li class="page-item' + (i === data.current ? ' active' : '') + '">';
            pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadUsers(' + i + ')">' + i + '</a></li>';
        }
        pagHtml += '<li class="page-item' + (data.current >= data.pages ? ' disabled' : '') + '">';
        pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadUsers(' + (data.current + 1) + ')">下一页</a></li>';
        pagHtml += '</ul>';
        pag.innerHTML = pagHtml;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function approveUser(id) {
        if (!confirm('确认审核通过该用户？')) return;
        apiPut('/api/v1/admin/users/' + id + '/status?status=1').then(result => {
            if (result.code === 200) {
                showToast('审核通过', 'success');
                loadUsers(document.querySelector('.page-item.active .page-link')?.textContent || 1);
            } else {
                showToast(result.msg, 'error');
            }
        });
    }

    function disableUser(id) {
        if (!confirm('确认禁用该用户？')) return;
        apiPut('/api/v1/admin/users/' + id + '/status?status=2').then(result => {
            if (result.code === 200) {
                showToast('已禁用', 'success');
                loadUsers(document.querySelector('.page-item.active .page-link')?.textContent || 1);
            } else {
                showToast(result.msg, 'error');
            }
        });
    }

    function enableUser(id) {
        if (!confirm('确认恢复该用户？')) return;
        apiPut('/api/v1/admin/users/' + id + '/status?status=1').then(result => {
            if (result.code === 200) {
                showToast('已恢复', 'success');
                loadUsers(document.querySelector('.page-item.active .page-link')?.textContent || 1);
            } else {
                showToast(result.msg, 'error');
            }
        });
    }

    function deleteUser(id) {
        if (!confirm('确认删除该待审核用户？此操作不可恢复。')) return;
        apiDel('/api/v1/admin/users/' + id).then(result => {
            if (result.code === 200) {
                showToast('已删除', 'success');
                loadUsers(document.querySelector('.page-item.active .page-link')?.textContent || 1);
            } else {
                showToast(result.msg, 'error');
            }
        });
    }

    // 初始化加载
    loadUsers(1);
</script>

</body>
</html>
