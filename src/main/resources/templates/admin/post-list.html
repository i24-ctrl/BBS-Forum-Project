<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帖子管理 - 校内BBS 后台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f5f5f5; }
    .admin-container { max-width: 1200px; margin: 30px auto; }
    .card { border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .badge-top-2 { background: #dc3545; }
    .badge-top-1 { background: #fd7e14; }
    .badge-essence { background: #ffc107; color: #333; }
    .status-badge-0 { background: #6c757d; color: #fff; }
    .status-badge-1 { background: #28a745; color: #fff; }
    .status-badge-2 { background: #dc3545; color: #fff; }
  </style>
</head>
<body>

<div class="container admin-container">
  <div class="card">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">📋 帖子管理</h4>
        <div>
          <select class="form-select form-select-sm d-inline-block w-auto" id="statusFilter" onchange="loadPosts(1)">
            <option value="">全部</option>
            <option value="0">待审核</option>
            <option value="1" selected>正常</option>
            <option value="2">违规下架</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th style="width:50px;">ID</th>
            <th>标题</th>
            <th>作者</th>
            <th>板块</th>
            <th>浏览/回复</th>
            <th>状态</th>
            <th>时间</th>
            <th style="width:220px;">操作</th>
          </tr>
          </thead>
          <tbody id="postTableBody">
          <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <nav id="pagination" class="d-flex justify-content-center"></nav>
    </div>
  </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const token = localStorage.getItem('token');
  if (!token) { window.location.href = '/login'; }

  function apiGet(url) {
    return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
              if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
              if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
              return res.json();
            });
  }

  function apiPut(url) {
    return fetch(url, { method: 'PUT', headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
              if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
              if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
              return res.json();
            });
  }

  function apiDel(url) {
    return fetch(url, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } })
            .then(res => {
              if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
              if (res.status === 403) { alert('无管理员权限'); window.location.href = '/'; }
              return res.json();
            });
  }

  function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';
    const html = '<div class="toast align-items-center text-white ' + bgClass + ' border-0" role="alert">' +
            '<div class="d-flex"><div class="toast-body">' + message + '</div>' +
            '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>';
    container.insertAdjacentHTML('beforeend', html);
    const toastEl = container.lastElementChild;
    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
    toast.show();
    toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
  }

  function loadPosts(page) {
    page = page || 1;
    const status = document.getElementById('statusFilter').value;
    let url = '/api/v1/admin/posts?page=' + page + '&size=10';
    if (status !== '') url += '&status=' + status;

    apiGet(url).then(result => {
      if (result.code === 200) renderPosts(result.data);
      else showToast(result.msg, 'error');
    });
  }

  function renderPosts(data) {
    const tbody = document.getElementById('postTableBody');
    if (!data.records || data.records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无帖子</td></tr>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    let html = '';
    data.records.forEach(p => {
      html += '<tr>';
      html += '<td>' + p.id + '</td>';
      html += '<td><a href="/post-detail?id=' + p.id + '" target="_blank" class="text-decoration-none">' + escapeHtml(p.title) + '</a>';
      if (p.isTop === 2) html += ' <span class="badge badge-top-2">🔝全局</span>';
      if (p.isTop === 1) html += ' <span class="badge badge-top-1">📌板块</span>';
      if (p.isEssence === 1) html += ' <span class="badge badge-essence">⭐精华</span>';
      html += '</td>';
      html += '<td>' + escapeHtml(p.authorName || '-') + '</td>';
      html += '<td>' + escapeHtml(p.boardName || '-') + '</td>';
      html += '<td>👁' + (p.viewCount || 0) + ' 💬' + (p.replyCount || 0) + '</td>';
      let statusText = '未知';
      let statusClass = 'status-badge-0';
      if (p.status === 1) { statusText = '正常'; statusClass = 'status-badge-1'; }
      if (p.status === 2) { statusText = '违规下架'; statusClass = 'status-badge-2'; }
      if (p.status === 0) { statusText = '待审核'; statusClass = 'status-badge-0'; }
      html += '<td><span class="badge ' + statusClass + '">' + statusText + '</span></td>';
      html += '<td><small>' + (p.createTime || '') + '</small></td>';
      html += '<td>';
      // 置顶按钮
      html += '<div class="btn-group btn-group-sm me-1 mb-1">';
      html += '<button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">置顶</button>';
      html += '<ul class="dropdown-menu">';
      html += '<li><a class="dropdown-item" href="javascript:void(0)" onclick="setTop(' + p.id + ',2)">🔝 全局置顶</a></li>';
      html += '<li><a class="dropdown-item" href="javascript:void(0)" onclick="setTop(' + p.id + ',1)">📌 板块置顶</a></li>';
      html += '<li><a class="dropdown-item" href="javascript:void(0)" onclick="setTop(' + p.id + ',0)">取消置顶</a></li>';
      html += '</ul></div>';
      // 精华按钮
      if (p.isEssence === 1) {
        html += '<button class="btn btn-outline-warning btn-sm me-1 mb-1" onclick="setEssence(' + p.id + ',0)">取消精华</button>';
      } else {
        html += '<button class="btn btn-outline-warning btn-sm me-1 mb-1" onclick="setEssence(' + p.id + ',1)">加精</button>';
      }
      // 下架/恢复按钮
      if (p.status === 2) {
        html += '<button class="btn btn-outline-success btn-sm me-1 mb-1" onclick="restorePost(' + p.id + ')">恢复正常</button>';
      } else {
        html += '<button class="btn btn-outline-danger btn-sm me-1 mb-1" onclick="markOffline(' + p.id + ')">违规下架</button>';
      }
      // 删除按钮
      html += '<button class="btn btn-outline-dark btn-sm mb-1" onclick="deletePost(' + p.id + ')">删除</button>';
      html += '</td></tr>';
    });
    tbody.innerHTML = html;

    // 分页
    const pag = document.getElementById('pagination');
    if (data.pages <= 1) { pag.innerHTML = ''; return; }
    let pagHtml = '<ul class="pagination pagination-sm">';
    pagHtml += '<li class="page-item' + (data.current <= 1 ? ' disabled' : '') + '">';
    pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadPosts(' + (data.current - 1) + ')">上一页</a></li>';
    for (let i = 1; i <= data.pages; i++) {
      pagHtml += '<li class="page-item' + (i === data.current ? ' active' : '') + '">';
      pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadPosts(' + i + ')">' + i + '</a></li>';
    }
    pagHtml += '<li class="page-item' + (data.current >= data.pages ? ' disabled' : '') + '">';
    pagHtml += '<a class="page-link" href="javascript:void(0)" onclick="loadPosts(' + (data.current + 1) + ')">下一页</a></li>';
    pagHtml += '</ul>';
    pag.innerHTML = pagHtml;
  }

  function setTop(id, type) {
    const typeLabel = { 0: '取消置顶', 1: '设为板块置顶', 2: '设为全局置顶' };
    if (!confirm('确认' + typeLabel[type] + '？')) return;
    apiPut('/api/v1/admin/posts/' + id + '/top?type=' + type).then(result => {
      if (result.code === 200) {
        showToast(result.msg, 'success');
        loadPosts(document.querySelector('.page-item.active .page-link')?.textContent || 1);
      } else {
        showToast(result.msg, 'error');
      }
    });
  }

  function setEssence(id, flag) {
    const label = flag === 1 ? '设为精华' : '取消精华';
    if (!confirm('确认' + label + '？')) return;
    apiPut('/api/v1/admin/posts/' + id + '/essence?flag=' + flag).then(result => {
      if (result.code === 200) {
        showToast(result.msg, 'success');
        loadPosts(document.querySelector('.page-item.active .page-link')?.textContent || 1);
      } else {
        showToast(result.msg, 'error');
      }
    });
  }

  function markOffline(id) {
    if (!confirm('确认将该帖子违规下架？')) return;
    apiPut('/api/v1/admin/posts/' + id + '/offline').then(result => {
      if (result.code === 200) {
        showToast(result.msg, 'success');
        loadPosts(document.querySelector('.page-item.active .page-link')?.textContent || 1);
      } else {
        showToast(result.msg, 'error');
      }
    });
  }

  function restorePost(id) {
    if (!confirm('确认将该帖子恢复正常？')) return;
    apiPut('/api/v1/admin/posts/' + id + '/restore').then(result => {
      if (result.code === 200) {
        showToast(result.msg, 'success');
        loadPosts(document.querySelector('.page-item.active .page-link')?.textContent || 1);
      } else {
        showToast(result.msg, 'error');
      }
    });
  }

  function deletePost(id) {
    if (!confirm('确认彻底删除该帖子？此操作不可恢复！')) return;
    apiDel('/api/v1/admin/posts/' + id).then(result => {
      if (result.code === 200) {
        showToast('删除成功', 'success');
        loadPosts(document.querySelector('.page-item.active .page-link')?.textContent || 1);
      } else {
        showToast(result.msg, 'error');
      }
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  loadPosts(1);
</script>

</body>
</html>
