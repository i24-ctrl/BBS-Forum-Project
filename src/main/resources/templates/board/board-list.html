<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: head('板块浏览')}"></head>
<body>

<div th:replace="~{common/header :: header}"></div>

<main class="bbs-main">
<div class="bbs-container">
    <div class="bbs-page-header">
        <div>
            <h4 class="bbs-page-title"><i class="bi bi-grid me-1"></i>板块浏览</h4>
            <p class="text-muted mb-0 small">点击板块查看该板块下的帖子</p>
        </div>
        <a href="/posts" class="btn btn-bbs-outline btn-sm"><i class="bi bi-list-ul me-1"></i>全部帖子</a>
    </div>

    <div class="row g-3" id="boardCards">
        <div class="col-12 bbs-empty">加载中...</div>
    </div>
</div>
</main>

<div th:replace="~{common/footer :: footer}"></div>
<script src="/static/js/common.js"></script>
<script>
(function () {
    var iconMap = { '技术交流': 'bi-code-slash', '校园生活': 'bi-house-heart', '二手交易': 'bi-cart', '求职招聘': 'bi-briefcase' };
    var colorMap = { '技术交流': '#6366f1', '校园生活': '#10b981', '二手交易': '#f59e0b', '求职招聘': '#8b5cf6' };

    BbsApi.get('/api/v1/boards').then(function (result) {
        var container = document.getElementById('boardCards');
        if (result.code !== 200) {
            container.innerHTML = '<div class="col-12 bbs-empty">' + BbsUtil.escapeHtml(result.msg || '加载失败') + '</div>';
            return;
        }
        var boards = result.data || [];
        if (boards.length === 0) {
            container.innerHTML = '<div class="col-12 bbs-empty">暂无可用板块</div>';
            return;
        }
        var html = '';
        boards.forEach(function (b) {
            var icon = iconMap[b.name] || 'bi-chat-dots';
            var color = colorMap[b.name] || '#64748b';
            html += '<div class="col-sm-6 col-lg-4">';
            html += '<div class="bbs-board-card" onclick="location.href=\'/posts?boardId=' + b.id + '\'">';
            html += '<div class="card-body p-4"><div class="d-flex align-items-start gap-3">';
            html += '<i class="bi ' + icon + ' bbs-board-icon" style="color:' + color + '"></i>';
            html += '<div><h5 class="fw-bold mb-2">' + BbsUtil.escapeHtml(b.name) + '</h5>';
            html += '<p class="text-muted small mb-2">' + BbsUtil.escapeHtml(b.description || '暂无描述') + '</p>';
            html += '<small class="text-muted"><i class="bi bi-file-text me-1"></i>' + (b.postCount || 0) + ' 篇帖子</small>';
            html += '</div></div></div></div></div>';
        });
        container.innerHTML = html;
    }).catch(function () {
        document.getElementById('boardCards').innerHTML = '<div class="col-12 bbs-empty">加载失败，请稍后重试</div>';
    });
})();
</script>
</body>
</html>
