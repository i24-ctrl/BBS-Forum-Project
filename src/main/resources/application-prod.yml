# ============================================================
# 校内BBS论坛系统 - 生产环境配置
# 启动方式：java -jar bbs.jar --spring.profiles.active=prod
# ============================================================

server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bbs?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 168168
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  redis:
    host: localhost
    port: 6379
    database: 0
    password:              # Redis 密码（如有）
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 2
        max-wait: 3000ms

  thymeleaf:
    cache: true            # 生产环境启用模板缓存

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 604800     # 静态资源缓存7天

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.bbs.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: WARN
    com.bbs: INFO
    com.bbs.mapper: WARN
    com.bbs.aspect: INFO
  file:
    name: /opt/bbs/logs/bbs.log
    max-size: 10MB
    max-history: 30

bbs:
  upload:
    path: /opt/bbs/upload/
    access-url: /upload/
    # 生产环境关闭 Swagger
    springdoc:
      api-docs:
        enabled: false
      swagger-ui:
        enabled: false