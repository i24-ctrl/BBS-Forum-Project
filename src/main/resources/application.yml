server:
  port: 8080

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bbs?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 168168
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.bbs.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.bbs.mapper: debug

bbs:
  upload:
    path: ${user.dir}/upload/
    access-url: /upload
    # ==================== SpringDoc OpenAPI ====================
    springdoc:
      swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha
        doc-expansion: list
        display-request-duration: true
      api-docs:
        path: /v3/api-docs
      group-configs:
        - group: '全部接口'
          paths-to-match: '/**'
        - group: '认证模块'
          paths-to-match: '/api/v1/auth/**'
        - group: '用户模块'
          paths-to-match: '/api/v1/user/**'
        - group: '板块帖子'
          paths-to-match: '/api/v1/boards/**,/api/v1/posts/**'
        - group: '需求悬赏'
          paths-to-match: '/api/v1/demands/**'
        - group: '管理员'
          paths-to-match: '/api/v1/admin/**'
        - group: '上传'
          paths-to-match: '/api/v1/upload/**'